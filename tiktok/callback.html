<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>TikTok sign-in</title><link rel="stylesheet" href="../style.css">
<h1>TikTok sign-in finished</h1>
<p>Copy this address and paste it into the terminal (<code style="display:inline;padding:2px 4px">social.py login tiktok</code>):</p>
<code id="u"></code><button id="b">Copy</button>
<script>const u=location.href;document.getElementById('u').textContent=u;document.getElementById('b').onclick=()=>navigator.clipboard.writeText(u).then(()=>document.getElementById('b').textContent='Copied');</script>
</html>
